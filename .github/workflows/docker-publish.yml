# [FLEET-ARCHITECT] Continuous Delivery — GHCR Container Publish
# Sync-ID: 2026-11-23-GHCR-001
name: Build & Publish Docker Image to GHCR

on:
  workflow_run:
    workflows: ["Fleet CI"]
    types: [completed]
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  ghcr-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: Bastien-Antigravity/fleet-operation-brain/.github/workflows/master-docker-publish.yml@develop
    with:
      package_name: squad-agent
    secrets: inherit
