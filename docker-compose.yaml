services:
  squad-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/bastien-antigravity/squad-agent-brain:${TAG:-latest}
    container_name: squad-agent
    restart: unless-stopped
    ports:
      - "${HOST_IP:-127.0.0.1}:8085:8085"
      - "${HOST_IP:-127.0.0.1}:8087:8087"
    environment:
      - SA_PORT=8085
      - SA_GRPC_PORT=8087
      - SA_PORT=8085
      - SA_GRPC_PORT=8087
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID:-}
    volumes:
      - ../:/app/obsidian-brain
      - ./standalone.yaml:/app/standalone.yaml:ro
    networks:
      - teleremote-network
    labels: [ com.centurylinklabs.watchtower.enable=true ]

networks:
  teleremote-network:
    name: teleremote-network
    external: true
